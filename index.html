
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historical Territories of the Himalayas</title>

<link href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
}

#panel {
  position: absolute;
  inset: 0 auto 0 0;
  width: 280px;
  padding: 14px;
  overflow-y: auto;
  background: white;
  border-right: 1px solid #ddd;
  z-index: 2;
}

#map {
  position: absolute;
  inset: 0 0 0 280px;
}

h2 {
  font-size: 19px;
}

h3 {
  font-size: 14px;
  margin-top: 22px;
  padding-bottom: 6px;
  border-bottom: 1px solid #ddd;
}

label {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 11px 0;
  font-size: 13px;
  cursor: pointer;
}

input {
  cursor: pointer;
}

.swatch {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
  border: 1px solid #777;
}

#status {
  margin-top: 20px;
  font-size: 12px;
  color: #555;
  overflow-wrap: anywhere;
}

.error {
  color: #c00;
}

@media (max-width: 600px) {
  #panel {
    width: 180px;
    padding: 9px;
  }

  #map {
    left: 180px;
  }
}
</style>
</head>

<body>

<aside id="panel">
  <h2>Historical Territories</h2>
  <p>Himalayan historical boundaries</p>
  <div id="layers"></div>
  <p id="status">Preparing layers...</p>
</aside>

<div id="map"></div>

<script>
const groups = [
  {
    name: "Region",
    layers: [
      { name: "Kirat", file: "Kirat.geojson", color: "#d97732" },
      { name: "Kirat Chiefs", file: "Kirat Chiefs.geojson", color: "#b45309" },
      { name: "Baisye", file: "Baisye.geojson", color: "#eab308" },
      { name: "Bagmati", file: "Bagmati.geojson", color: "#ca8a04" },
      { name: "Chaubise", file: "Chaubise.geojson", color: "#16a34a" },
      { name: "Eastern Sen", file: "Eastern Sen.geojson", color: "#0d9488" },
      { name: "Gorkha", file: "Gorkha.geojson", color: "#2563eb" },
      { name: "Himanchal", file: "Himanchal.geojson", color: "#7c3aed" },
      { name: "Sikkim", file: "Sikkim.geojson", color: "#db2777" },
      { name: "Uttarkhand", file: "Uttarkhand.geojson", color: "#9333ea" }
    ]
  },
  {
    name: "Geography",
    layers: [
      {
        name: "Mountains above 5000m",
        file: "Mountains (above 5000m).geojson",
        color: "#64748b"
      },
      {
        name: "Outline",
        file: "Outline.geojson",
        color: "#dc2626"
      }
    ]
  }
];

const panel = document.getElementById("layers");
const status = document.getElementById("status");
const controls = [];

// Create the layer controls.
groups.forEach((group, gi) => {
  const heading = document.createElement("h3");
  heading.textContent = group.name;
  panel.appendChild(heading);

  group.layers.forEach((layer, li) => {
    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    const swatch = document.createElement("span");
    const text = document.createElement("span");

    checkbox.type = "checkbox";
    checkbox.checked = true;

    swatch.className = "swatch";
    swatch.style.backgroundColor = layer.color;

    text.textContent = layer.name;

    label.append(checkbox, swatch, text);
    panel.appendChild(label);

    controls.push({ checkbox, label, layer, gi, li });
  });
});

if (!window.maplibregl) {
  status.textContent =
    "MapLibre failed to load. Check your internet connection.";
  status.className = "error";
} else {
  const map = new maplibregl.Map({
    container: "map",
    style: "https://demotiles.maplibre.org/style.json",
    center: [85, 27.5],
    zoom: 5
  });

  map.addControl(new maplibregl.NavigationControl());

  map.on("error", event => {
    console.error("Map error:", event.error);
  });

  map.on("load", async () => {
    let loaded = 0;
    let failed = 0;

    for (const item of controls) {
      const { checkbox, label, layer, gi, li } = item;

      const id = `layer-${gi}-${li}`;
      const fillId = `${id}-fill`;
      const lineId = `${id}-line`;

      try {
        // GeoJSON files must be in the same folder as index.html.
        const url = new URL(
          encodeURI(layer.file),
          document.baseURI
        ).href;

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.type) {
          throw new Error("Invalid GeoJSON");
        }

        map.addSource(id, {
          type: "geojson",
          data: data
        });

        map.addLayer({
          id: fillId,
          type: "fill",
          source: id,
          paint: {
            "fill-color": layer.color,
            "fill-opacity": 0.25
          }
        });

        map.addLayer({
          id: lineId,
          type: "line",
          source: id,
          paint: {
            "line-color": layer.color,
            "line-width": 1.5
          }
        });

        // Toggle layer visibility.
        checkbox.addEventListener("change", () => {
          const visibility = checkbox.checked
            ? "visible"
            : "none";

          map.setLayoutProperty(
            fillId,
            "visibility",
            visibility
          );

          map.setLayoutProperty(
            lineId,
            "visibility",
            visibility
          );
        });

        // Show feature information when clicked.
        map.on("click", fillId, event => {
          const feature = event.features?.[0];

          if (!feature) return;

          const popup = document.createElement("div");
          const title = document.createElement("strong");

          title.textContent = layer.name;
          popup.appendChild(title);

          Object.entries(feature.properties || {})
            .slice(0, 12)
            .forEach(([key, value]) => {
              const row = document.createElement("div");
              row.textContent = `${key}: ${value ?? ""}`;
              popup.appendChild(row);
            });

          new maplibregl.Popup()
            .setLngLat(event.lngLat)
            .setDOMContent(popup)
            .addTo(map);
        });

        // Change cursor when hovering over a region.
        map.on("mouseenter", fillId, () => {
          map.getCanvas().style.cursor = "pointer";
        });

        map.on("mouseleave", fillId, () => {
          map.getCanvas().style.cursor = "";
        });

        loaded++;
      } catch (error) {
        failed++;

        checkbox.checked = false;
        label.classList.add("error");
        label.title = `${layer.file}: ${error.message}`;

        console.error(`Failed: ${layer.file}`, error);
      }

      status.textContent =
        `${loaded} of ${loaded + failed} layers loaded` +
        (failed
          ? `; ${failed} failed. Hover over a red layer for details.`
          : ".");
    }
  });

  map.on("load", () => map.resize());
}
</script>

</body>
</html>
